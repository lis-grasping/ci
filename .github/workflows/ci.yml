name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint the workflows
        # With shellcheck on the path, actionlint also checks the scripts of `run`
        run: uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
      - name: Lint the scripts
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  release-check:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    uses: ./.github/workflows/release-check.yml
    with:
      version-source: changelog

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, release-check]
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-check.outputs.tag }}
      title: ci ${{ needs.release-check.outputs.version }}
      notes: ${{ needs.release-check.outputs.notes }}
