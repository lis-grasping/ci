name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to create, from the release check.
        type: string
        required: true
      title:
        description: The title of the GitHub release, such as `graspkit 0.3.0`.
        type: string
        required: true
      notes:
        description: The release notes, from the release check.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: >-
          gh release create "$TAG"
          --repo "$REPO"
          --target "$GITHUB_SHA"
          --title "$TITLE"
          --notes "$NOTES"
